<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg-forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#254c45"/>
      <stop offset="100%" stop-color="#142b27"/>
    </linearGradient>
    <linearGradient id="heart-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Outer editorial forest badge -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg-forest)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.8" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

  <!-- 2x2 Bento Sudoku Cells -->
  <!-- Top-Left: Warm Cream clue cell with serif "9" -->
  <rect x="4" y="4" width="11" height="11" rx="2.4" fill="#f5f4ef"/>
  <text x="9.5" y="12.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="8.6" fill="#1c3b36">9</text>

  <!-- Top-Right: Soft Blush/Cream cell with crisp red heart -->
  <rect x="17" y="4" width="11" height="11" rx="2.4" fill="#fef2f2"/>
  <path d="M22.5 13.1 C22.5 13.1 18.6 10.65 18.6 8.35 C18.6 7.05 19.65 6.1 20.85 6.1 C21.62 6.1 22.22 6.52 22.5 7.12 C22.78 6.52 23.38 6.1 24.15 6.1 C25.35 6.1 26.4 7.05 26.4 8.35 C26.4 10.65 22.5 13.1 22.5 13.1 Z" fill="url(#heart-red)"/>

  <!-- Bottom-Left: Warm Sand cell -->
  <rect x="4" y="17" width="11" height="11" rx="2.4" fill="#e9e4d5"/>
  <circle cx="9.5" cy="22.5" r="1.45" fill="#1c3b36" opacity="0.32"/>

  <!-- Bottom-Right: Warm Cream cell with sculpted Kitty Paw -->
  <rect x="17" y="17" width="11" height="11" rx="2.4" fill="#f5f4ef"/>
  <path d="M22.5 22.4c-1.35 0-2.4 1.02-2.4 2.2 0 .82.6 1.38 1.32 1.38.44 0 .74-.18 1.08-.18s.64.18 1.08.18c.72 0 1.32-.56 1.32-1.38 0-1.18-1.05-2.2-2.4-2.2Z" fill="#1c3b36"/>
  <ellipse cx="19.55" cy="21.6" rx="0.82" ry="1.12" transform="rotate(-18 19.55 21.6)" fill="#1c3b36"/>
  <ellipse cx="21.35" cy="19.95" rx="0.82" ry="1.15" transform="rotate(-6 21.35 19.95)" fill="#1c3b36"/>
  <ellipse cx="23.65" cy="19.95" rx="0.82" ry="1.15" transform="rotate(6 23.65 19.95)" fill="#1c3b36"/>
  <ellipse cx="25.45" cy="21.6" rx="0.82" ry="1.12" transform="rotate(18 25.45 21.6)" fill="#1c3b36"/>
</svg>
